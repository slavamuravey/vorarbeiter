name: 'Setup Node and Dependencies'
description: 'Checkout, setup Node.js, and install npm dependencies'
runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
      shell: bash
